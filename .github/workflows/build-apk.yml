name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build & sign CARANTIN.apk
        run: |
          chmod +x android/build_apk.sh
          ./android/build_apk.sh CARANTIN.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CARANTIN-apk
          path: CARANTIN.apk
          retention-days: 90

      - name: Publish GitHub Release on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest CARANTIN.apk --clobber
          else
            gh release create apk-latest CARANTIN.apk \
              --title "CARANTIN Android APK (v2.3)" \
              --notes "Готовый установочный APK-файл для Android (горизонтальный режим, увеличенные джойстики движения и стрельбы, траектория прицеливания, офлайн-работа и 30 видов зомби)." \
              --latest
          fi
